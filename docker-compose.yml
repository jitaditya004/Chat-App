version: "3.9"

services:
  backend:
    build: ./server
    container_name: chat-backend
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    depends_on:
      - mongo

  frontend:
    build: ./client
    container_name: chat-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: chat-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: